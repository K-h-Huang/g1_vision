# Paths are resolved relative to this deployment folder.
robot_xml_path: "{DEPLOY_DIR}/g1/g1_29dof_with_camera.xml"
deploy_yaml_path: "{DEPLOY_DIR}/parkour_policy/params/deploy.yaml"
actor_onnx_path: "{DEPLOY_DIR}/parkour_policy/exported/actor.onnx"
depth_encoder_onnx_path: "{DEPLOY_DIR}/parkour_policy/exported/0-depth_encoder.onnx"

simulation_duration: 60.0
simulation_dt: 0.002
control_decimation: 10
warmup_duration: 1.0
command_ramp_duration: 2.0
action_smoothing: 0.2
action_clip: 1.0

# Camera/depth settings from the G1 deployment C++ path:
# EncoderRunner width=32 height=18 history=8.
depth_camera_name: depth_cam
depth_width: 32
depth_height: 18
depth_history: 8
depth_history_skip_frames: 5
depth_render_width: 64
depth_render_height: 36
depth_min_range: 0.2
depth_max_range: 2.0
depth_noise_amp: 0.0
depth_vis_rotate_k: 0
show_depth_window: true
depth_window_scale: 10

# Fixed command used when no gamepad/keyboard command source is attached.
# The script ramps from zero to this command after warmup_duration.
cmd_init: [0.3, 0.0, 0.0]

# Start from the policy default joint pose and stand above the ground plane.
initial_base_pos: [0.0, 0.0, 0.86]
initial_base_quat: [1.0, 0.0, 0.0, 0.0]

# Use the same procedural obstacle layout as FeapVision_Mujoco_deployment:
# long stairs up/down, low ramp, rear platforms. Set terrain_mode: simple to use
# the fallback extra_geoms list below.
terrain_mode: feapvision

# Fallback simple terrain geoms.
extra_geoms:
  - name: floor
    type: plane
    pos: [0.0, 0.0, 0.0]
    size: [20.0, 20.0, 0.05]
    rgba: [0.35, 0.38, 0.40, 1.0]
  - name: low_step_1
    type: box
    pos: [1.2, 0.0, 0.08]
    size: [0.25, 0.8, 0.08]
    rgba: [0.55, 0.52, 0.45, 1.0]
  - name: low_step_2
    type: box
    pos: [1.7, 0.0, 0.16]
    size: [0.25, 0.8, 0.16]
    rgba: [0.50, 0.47, 0.42, 1.0]
